apiVersion: mellanox.com/v1alpha1
kind: NicClusterPolicy
metadata:
  name: nic-cluster-policy
spec:
  # The OCI image supplies the DOCA-OFED driver, so no ofedDriver section.
  sriovDevicePlugin:
    image: sriov-network-device-plugin
    repository: nvcr.io/nvidia/mellanox
    version: network-operator-v26.7.0
    # Exposes the 16 RDMA PFs of each BM.GPU.B300.8 node as nvidia.com/hostdev.
    # The front-end NIC is also a 15b3 device, so the PFs are listed by PCI address.
    config: |
      {
        "resourceList": [
          {
            "resourcePrefix": "nvidia.com",
            "resourceName": "hostdev",
            "selectors": {
              "vendors": ["15b3"],
              "isRdma": true,
              "pciAddresses": [
                "0000:11:00.0", "0000:11:00.1", "0000:2f:00.0", "0000:2f:00.1",
                "0000:46:00.0", "0000:46:00.1", "0000:5d:00.0", "0000:5d:00.1",
                "0000:8b:00.0", "0000:8b:00.1", "0000:aa:00.0", "0000:aa:00.1",
                "0000:c2:00.0", "0000:c2:00.1", "0000:da:00.0", "0000:da:00.1"
              ]
            }
          }
        ]
      }
  nvIpam:
    image: nvidia-k8s-ipam
    repository: nvcr.io/nvidia/mellanox
    version: network-operator-v26.7.0
    enableWebhook: false
  secondaryNetwork:
    cniPlugins:
      image: plugins
      repository: nvcr.io/nvidia/mellanox
      version: network-operator-v26.7.0
    multus:
      image: multus-cni
      repository: nvcr.io/nvidia/mellanox
      version: network-operator-v26.7.0
