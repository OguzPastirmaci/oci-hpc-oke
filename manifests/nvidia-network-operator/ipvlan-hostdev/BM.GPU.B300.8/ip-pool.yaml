apiVersion: nv-ipam.nvidia.com/v1alpha1
kind: IPPool
metadata:
  name: rdma-ipvlan-pool
  namespace: nvidia-network-operator
spec:
  # Placeholder addresses. The IPvlan CNI needs an IPAM, but these addresses do not route
  # on the B300 rails. The rail router gives each IPvlan interface its routed address (SLAAC).
  # The range must not overlap the rail prefixes. See step 7 of the README.
  subnet: fd01:0:0:100::/112
  perNodeBlockSize: 32
  nodeSelector:
    nodeSelectorTerms:
      - matchExpressions:
          - key: node.kubernetes.io/instance-type
            operator: In
            values:
              - BM.GPU.B300.8
