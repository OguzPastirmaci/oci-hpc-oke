# One IPvlan L2 interface on each RDMA rail. The interface uses the MAC address of its rail (rdmaN).
# It gets a placeholder address from NVIDIA IPAM and its routed IPv6 address from the rail router (SLAAC).
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: rdma-ipvlan-0
  namespace: default
spec:
  config: |
    {
      "cniVersion": "1.0.0",
      "name": "rdma-ipvlan-0",
      "plugins": [
        {
          "type": "ipvlan",
          "master": "rdma0",
          "mode": "l2",
          "ipam": { "type": "nv-ipam", "poolName": "rdma-ipvlan-pool" }
        }
      ]
    }
---
