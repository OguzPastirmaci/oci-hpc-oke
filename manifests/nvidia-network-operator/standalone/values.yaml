nfd:
  # The cluster already runs Node Feature Discovery (for example from the GPU Operator).
  enabled: false

sriovNetworkOperator:
  enabled: true

sriov-network-operator:
  sriovOperatorConfig:
    deploy: true
    disableDrain: false
    configurationMode: daemon
    # The OCI image owns the NIC firmware settings. This stops firmware changes and reboot requests.
    disablePlugins:
      - mellanox
