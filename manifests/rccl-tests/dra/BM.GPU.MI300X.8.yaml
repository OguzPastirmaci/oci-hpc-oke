apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: rccl-sriov-vf-8
  namespace: default
spec:
  spec:
    devices:
      requests:
      - name: vf
        exactly:
          deviceClassName: sriovnetwork.k8snetworkplumbingwg.io
          count: 8
          selectors:
          - cel:
              expression: device.attributes["k8s.cni.cncf.io"].resourceName == "nvidia.com/sriov-rdma-vf"
---
apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: rccl-tests
  namespace: default
spec:
  slotsPerWorker: 8
  runPolicy:
    cleanPodPolicy: "Running"
  sshAuthMountPath: /root/.ssh
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        metadata:
          labels:
            rccl-tests-replica: mpi-launcher
        spec:
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: 2
          containers:
          - name: mpi-launcher
            image: iad.ocir.io/idxzjcdglx2s/rccl-tests:rocm-7.1.1-ubuntu22.04-rccl-2.27.7-011826.1
            imagePullPolicy: Always
            command: ["bash", "-c"]
            args:
            - |
              set -e -o pipefail
              trap 'exit 1' SIGINT
              NUM_GPUS=8
              NUM_HOSTS=$(sed -n '$=' /etc/mpi/hostfile)
              NP=$(($NUM_HOSTS*$NUM_GPUS))

              while ! (for host in $(awk '{print $1}' /etc/mpi/hostfile); do
                ssh -o ConnectTimeout=5 -o StrictHostKeyChecking=no $host exit 2>/dev/null || exit 1
              done); do
                echo "Waiting for workers to be ready..."
                sleep 5
              done
              echo "All workers are ready!"

              mpirun \
                -mca coll ^hcoll \
                -mca pml ucx \
                -mca pml_ucx_tls any \
                -mca pml_ucx_devices any \
                --allow-run-as-root \
                -np $NP \
                -npernode $NUM_GPUS \
                --bind-to numa \
                -x RX_QUEUE_LEN=8192 \
                -x IB_RX_QUEUE_LEN=8192 \
                -x UCX_TLS=tcp,self,sm \
                -x UCX_NET_DEVICES=eth0 \
                -x HCOLL_ENABLE_MCAST_ALL=0 \
                -x coll_hcoll_enable=0 \
                -x NCCL_CUMEM_ENABLE=0 \
                -x NCCL_IB_TIMEOUT=22 \
                -x NCCL_IB_SL=0 \
                -x NCCL_IB_TC=41 \
                -x NCCL_IB_GID_INDEX=3 \
                -x NCCL_DEBUG=WARN \
                -x NCCL_IB_QPS_PER_CONNECTION=1 \
                -x NCCL_IB_SPLIT_DATA_ON_QPS=0 \
                -x NCCL_IB_HCA=mlx5 \
                -x NCCL_PXN_DISABLE=0 \
                -x NCCL_NET_PLUGIN=none \
                -x LD_LIBRARY_PATH \
                /workspace/rccl-tests/build/all_reduce_perf -b 1G -e 16G -f 2 -g 1 -n 50
            resources:
              limits:
                ephemeral-storage: 32Gi
              requests:
                cpu: 2
                ephemeral-storage: 32Gi
                memory: 2Gi
            securityContext:
              privileged: true
              capabilities:
                add: [IPC_LOCK, SYS_PTRACE]
            volumeMounts:
            - { mountPath: /dev/shm, name: shm }
            workingDir: /workspace
          volumes:
          - { name: shm, emptyDir: { medium: Memory, sizeLimit: 128Gi }}
    Worker:
      replicas: 2
      template:
        metadata:
          labels:
            rccl-tests-replica: mpi-worker
          annotations:
            k8s.v1.cni.cncf.io/networks: rdma-vf,rdma-vf,rdma-vf,rdma-vf,rdma-vf,rdma-vf,rdma-vf,rdma-vf
        spec:
          restartPolicy: OnFailure
          terminationGracePeriodSeconds: 2
          nodeSelector:
            node.kubernetes.io/instance-type: BM.GPU.MI300X.8
          tolerations:
          - key: amd.com/gpu
            operator: Exists
            effect: NoSchedule
          containers:
          - name: mpi-worker
            image: iad.ocir.io/idxzjcdglx2s/rccl-tests:rocm-7.1.1-ubuntu22.04-rccl-2.27.7-011826.1
            imagePullPolicy: Always
            command:
            - /bin/bash
            - -c
            - mkdir -p /var/run/sshd; /usr/sbin/sshd -D
            resources:
              limits:
                ephemeral-storage: 32Gi
                amd.com/gpu: 8
              requests:
                cpu: 200
                ephemeral-storage: 32Gi
                memory: 1024Gi
                amd.com/gpu: 8
              # The 8 VFs come from DRA, not the SR-IOV device plugin, so there
              # is no nvidia.com/rdma-vf request here.
              claims:
              - name: vf
            securityContext:
              privileged: true
              capabilities:
                add: [IPC_LOCK, SYS_PTRACE]
            volumeMounts:
            - { mountPath: /dev/shm, name: shm }
            workingDir: /workspace
          resourceClaims:
          - name: vf
            resourceClaimTemplateName: rccl-sriov-vf-8
          volumes:
          - { name: shm, emptyDir: { medium: Memory, sizeLimit: 128Gi }}
